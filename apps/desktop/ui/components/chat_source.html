{% import "components/ds.html" as ds %}
<li>
  <button type="button" class="source-item" hx-get="{{ s.url }}" hx-target="#viewer" title="Abrir a fonte {{ s.n }} no PDF">
    <span class="citation" aria-hidden="true">{{ s.n }}</span>
    <span class="source-item-body">
      <span class="source-item-title"><span class="truncate">{{ s.title }}</span><span class="tabular">{{ s.pages }}</span>{% if !s.section.is_empty() %}<span class="truncate source-item-section">· {{ s.section }}</span>{% endif %}</span>
      <span class="source-item-quote">{{ s.preview }}</span>
    </span>
    <span class="source-item-open">{% call ds::icon("document") %}{% endcall %}Abrir no PDF</span>
  </button>
</li>
