{% import "components/ds.html" as ds %}
{% import "components/page.html" as page %}
<div class="page">
  {% call page::header(title, "Algo não saiu como esperado.") %}{% endcall %}
  <div class="page-body">
    {% call ds::alert("danger", title, message) %}
      <div class="alert-actions">
        <a class="btn btn-secondary btn-sm" href="/chat" hx-get="/chat" hx-target="#content" hx-push-url="true">Voltar ao Chat</a>
      </div>
    {% endcall %}
  </div>
</div>
